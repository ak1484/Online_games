<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multiplayer Room Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Multiplayer Room Prototype</h1>
    </header>

    <section class="room-panel">
      <div class="room-actions">
        <button id="create-room">Create Room</button>
        <input id="room-code" placeholder="Enter room code" />
        <button id="join-room">Join Room</button>
      </div>
      <div class="room-status" id="room-status">Room not created</div>
    </section>

    <section class="game-panel hidden" id="game-panel">
      <div class="game-controls">
        <p>Room code: <strong id="current-room">—</strong></p>
        <p>Players in room: <strong id="player-count">0</strong></p>
        <button id="leave-room">Leave Room</button>
        <button id="debug-log-room">Debug: Log Room</button>
      </div>
      <div class="board" id="board"></div>
    </section>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
