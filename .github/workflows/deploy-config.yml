name: Deploy with Firebase Config

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Create Firebase config file from secrets
        run: |
          mkdir -p infra
          cat > infra/demo_database_config.json << 'EOF'
          {
            "type": "firebase",
            "env": "development",
            "note": "Generated by GitHub Actions - do not commit",
            "firebase": {
              "apiKey": "${{ secrets.FIREBASE_API_KEY }}",
              "authDomain": "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
              "databaseURL": "${{ secrets.FIREBASE_DATABASE_URL }}",
              "projectId": "${{ secrets.FIREBASE_PROJECT_ID }}",
              "storageBucket": "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
              "messagingSenderId": "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
              "appId": "${{ secrets.FIREBASE_APP_ID }}",
              "measurementId": "${{ secrets.FIREBASE_MEASUREMENT_ID }}"
            }
          }
          EOF
          echo "Firebase config created:"
          cat infra/demo_database_config.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
